[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# 库路径不写死在这里：env.py 优先取调用方注入的 sqlalchemy.url，
# 其次取 RFTRACK_DB_PATH，保证 CLI 与 migrate.py 用的是同一个库。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

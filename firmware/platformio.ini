; Widscan58 firmware. GPL-3.0-or-later.
;
; pioarduino 55.03.312-1 = ESP-IDF 5.5.5, PlatformIO Core >= 6.2.
; esp-sdr pins ESP-IDF 25fe69f9 (6.2-dev) for its private PHY ABI. Every PHY
; function src/radio/s3 calls is instruction-identical between that pin and
; IDF 5.5.5 (tools/check_phy_abi.sh esp32s3 25fe69f9... v5.5.5). Re-run the
; check before changing the platform version.

[platformio]
default_envs = esp32c5

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
; Reconfigure when git describe (PROJECT_VER) changes; see the script.
extra_scripts = pre:version_check.py

[env:esp32s3]
; ESP32-S3 "Micro" board: native USB Serial/JTAG only, 4 MB flash.
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
; The USB Serial/JTAG peripheral resets into download mode in hardware;
; no BOOT button is needed even while our firmware runs.
board_upload.before_reset = usb-reset
upload_speed = 921600
build_flags = -DRX_TARGET_S3=1

[env:esp32s3-relay]
; The S3 as a relay host: no scanning (one PHY, and STA must sit on the AP's
; channel), Wi-Fi + ws:// uplink only. Same board and partitions as esp32s3.
; build_flags and extra_scripts replace the inherited values outright, so both
; are written out in full here.
; The env: prefix is not decoration: PlatformIO walks extends as a literal
; section name, so "esp32s3" would resolve to nothing and leave board unset
; (which fails much later, inside the platform's package setup).
extends = env:esp32s3
build_flags = -DRX_TARGET_S3=1 -DRX_WIFI_RELAY=1
extra_scripts = pre:version_check.py
    pre:relay_build.py

[env:esp32c5]
; ESP32-C5-DevKitC-1 on its native USB Serial/JTAG port. The C5 PHY functions
; src/radio/c5 calls are instruction-identical between esp-sdr's IDF pin and
; IDF 5.5.5 too (tools/check_phy_abi.sh esp32c5 ...).
board = esp32-c5-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_upload.before_reset = usb-reset
upload_speed = 921600
build_flags = -DRX_TARGET_C5=1

[env:native]
; Host unit tests for the target-independent scanner code.
platform = native
framework =
build_flags = -std=gnu11 -lm -Isrc/scan -Isrc/dsp -Isrc/net -Isrc/proto
test_build_src = no

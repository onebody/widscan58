# Build the firmware versions listed in firmware/versions.json and the web UI,
# and publish both to GitHub Pages. The page lets the user pick a version when
# flashing (web/src/serial/flasher.ts), so the binaries never go into git.
# GPL-3.0-or-later.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Refreshing only an experimental ref (pushing a branch other than main) needs
# a manual run: Actions > Pages > Run workflow.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running one finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # PlatformIO envs to publish. The S3 is held back until its USB flashing is
  # reliable; to add it, list it here and enable it in flasher.ts.
  FW_ENVS: esp32c5 # esp32s3
  # versions.json refs: "origin/..." is this repository (the fork), and
  # "upstream/..." is the project's own, fetched below.
  UPSTREAM: https://github.com/CapnBry/widscan58.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for git describe

      - name: Fetch the firmware refs
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags "$UPSTREAM" '+refs/heads/main:refs/remotes/upstream/main'

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: firmware/platformio.ini

      # The platform, ESP-IDF and toolchains (~85 s to install). The key follows
      # platformio.ini, which pins the platform version.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            !~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      # Each version is built in a worktree of its own ref, so the env and the
      # version reported by INFO are the ref's, not this commit's. The staging
      # tool is this commit's: the official ref predates it.
      - name: Build the firmware versions
        run: |
          set -euo pipefail
          pip install platformio
          rm -rf "$RUNNER_TEMP/fw" web/public/firmware
          mkdir -p "$RUNNER_TEMP/fw" web/public/firmware
          tools/pages_firmware.py --list | while IFS=$'\t' read -r id ref label note; do
            echo "::group::$id"
            git worktree add --detach -- "$RUNNER_TEMP/fw/$id" "$ref"
            for env in $FW_ENVS; do
              (cd "$RUNNER_TEMP/fw/$id/firmware" && pio run -e "$env")
            done
            tools/pages_firmware.py --id "$id" --src "$RUNNER_TEMP/fw/$id" web/public/firmware $FW_ENVS
            git worktree remove --force "$RUNNER_TEMP/fw/$id"
            echo "::endgroup::"
          done
          tools/pages_firmware.py --index web/public/firmware

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    # Pull requests only check that everything builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
